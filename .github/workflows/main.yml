
name: Build ESQ Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.example .

      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found"
            exit 1
          fi

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Align Android build versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")

          app_candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          app = next((p for p in app_candidates if p.exists()), None)

          if not settings.exists():
              raise SystemExit("ERROR: android/settings.gradle not found")
          if not wrapper.exists():
              raise SystemExit("ERROR: Gradle wrapper properties not found")
          if app is None:
              raise SystemExit("ERROR: Android app Gradle file not found")

          # Align Android Gradle Plugin and Kotlin plugin.
          s = settings.read_text()

          agp_pattern = (
              r'(?m)^([ \t]*id[ \t]*\(?[ \t]*'
              r'["\']com\.android\.application["\'][ \t]*\)?'
              r'[ \t]*version[ \t]*["\'])[^"\']+(["\'])'
          )
          kotlin_pattern = (
              r'(?m)^([ \t]*id[ \t]*\(?[ \t]*'
              r'["\']org\.jetbrains\.kotlin\.android["\'][ \t]*\)?'
              r'[ \t]*version[ \t]*["\'])[^"\']+(["\'])'
          )

          s, agp_count = re.subn(agp_pattern, r'\g<1>8.6.1\2', s)
          s, kotlin_count = re.subn(kotlin_pattern, r'\g<1>2.0.21\2', s)

          if agp_count != 1:
              raise SystemExit(
                  f"ERROR: Expected 1 AGP version entry, found {agp_count}"
              )
          if kotlin_count != 1:
              raise SystemExit(
                  f"ERROR: Expected 1 Kotlin version entry, found {kotlin_count}"
              )

          settings.write_text(s)

          # AGP 8.6 requires Gradle 8.7.
          w = wrapper.read_text()
          w, wrapper_count = re.subn(
              r'gradle-[0-9]+(?:\.[0-9]+)*-(?:all|bin)\.zip',
              'gradle-8.7-all.zip',
              w,
          )

          if wrapper_count != 1:
              raise SystemExit(
                  f"ERROR: Expected 1 Gradle distribution URL, found {wrapper_count}"
              )

          wrapper.write_text(w)

          # CameraX 1.5.0 requires compileSdk 35 or higher.
          a = app.read_text()
          compile_pattern = (
              r'(?m)^([ \t]*compileSdk(?:Version)?'
              r'[ \t]*(?:=[ \t]*)?).+$'
          )
          a, compile_count = re.subn(compile_pattern, r'\g<1>35', a)

          if compile_count != 1:
              raise SystemExit(
                  f"ERROR: Expected 1 compileSdk entry in {app}, "
                  f"found {compile_count}"
              )

          app.write_text(a)

          print("=== Android build configuration ===")
          print(settings.read_text())
          print("=== Gradle wrapper ===")
          print(wrapper.read_text())
          print("=== App compileSdk ===")
          for line in app.read_text().splitlines():
              if re.match(r'^[ \t]*compileSdk(?:Version)?\b', line):
                  print(line)
          print("Android build configuration updated successfully.")
          PY

      - name: Check Flutter
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: >
          flutter build apk --release
          --dart-define=ATTENDANCE_API_URL=https://corporate.esqmalaysia.com/scannerQR

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esq-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
