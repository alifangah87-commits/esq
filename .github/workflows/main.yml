
name: Build ESQ Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.example .

      - name: Update Android Gradle Plugin and Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle")
          if not p.exists():
              raise SystemExit("ERROR: android/settings.gradle tidak dijumpai")

          s = p.read_text()

          s, agp_count = re.subn(
              r'(?m)(id\s*\(?\s*["\']com\.android\.application["\']\s*version\s*["\'])[^"\']+(["\'])',
              r'\g<1>8.6.1\2',
              s
          )

          s, kotlin_count = re.subn(
              r'(?m)(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*version\s*["\'])[^"\']+(["\'])',
              r'\g<1>2.0.21\2',
              s
          )

          print(s)
          print(f"AGP entries updated: {agp_count}")
          print(f"Kotlin entries updated: {kotlin_count}")

          if agp_count == 0:
              raise SystemExit("ERROR: Versi AGP tidak dijumpai dalam settings.gradle")

          if kotlin_count == 0:
              raise SystemExit("ERROR: Versi Kotlin tidak dijumpai dalam settings.gradle")

          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: >
          flutter build apk --release
          --dart-define=ATTENDANCE_API_URL=https://corporate.esqmalaysia.com/scannerQR

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esq-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
