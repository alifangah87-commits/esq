
name: Build ESQ Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.example .

      - name: Align Android build tool versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")

          if not settings.exists():
              raise SystemExit("ERROR: android/settings.gradle not found")

          if not wrapper.exists():
              raise SystemExit("ERROR: Gradle wrapper properties not found")

          content = settings.read_text()

          agp_pattern = r'(?m)^(\s*id\s*\(?\s*["\']com\.android\.application["\']\s*\)?\s*version\s*["\'])[^"\']+(["\'])'
          kotlin_pattern = r'(?m)^(\s*id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s*version\s*["\'])[^"\']+(["\'])'

          content, agp_count = re.subn(
              agp_pattern, r'\g<1>8.6.1\2', content
          )
          content, kotlin_count = re.subn(
              kotlin_pattern, r'\g<1>2.0.21\2', content
          )

          if agp_count == 0:
              raise SystemExit("ERROR: Could not update AGP version")
          if kotlin_count == 0:
              raise SystemExit("ERROR: Could not update Kotlin version")

          settings.write_text(content)

          wrapper_content = wrapper.read_text()
          wrapper_content, wrapper_count = re.subn(
              r'gradle-[0-9][0-9.]*-(?:all|bin)\.zip',
              'gradle-8.7-all.zip',
              wrapper_content
          )

          if wrapper_count == 0:
              raise SystemExit("ERROR: Could not update Gradle wrapper URL")

          wrapper.write_text(wrapper_content)

          print("=== Verified Android settings ===")
          print(settings.read_text())
          print("=== Verified Gradle wrapper ===")
          print(wrapper.read_text())
          print("AGP updated:", agp_count)
          print("Kotlin updated:", kotlin_count)
          print("Gradle wrapper updated:", wrapper_count)
          PY

      - name: Check Flutter
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: >
          flutter build apk --release
          --dart-define=ATTENDANCE_API_URL=https://corporate.esqmalaysia.com/scannerQR

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esq-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
