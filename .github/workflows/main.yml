name: Build ESQ Scanner APK

on:
  workflow_dispatch:          # Boleh tekan button "Run workflow" manual
  push:
    branches: [ main ]        # Auto build setiap kali push ke main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --dart-define=ATTENDANCE_API_BASE=https://corporate.esqmalaysia.com/scannerQR

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esq-scanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
